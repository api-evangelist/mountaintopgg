name: Mountaintop.gg
description: Mountaintop (Mountaintop.gg) was a remote-first independent video game studio founded
  in 2020 by veterans of Blizzard, Respawn, Riot, and Bungie, led by Oculus co-founder Nate Mitchell.
  Backed by a Series A led by Andreessen Horowitz (a16z), the studio built Spectre Divide, a free-to-play
  3v3 tactical PvP shooter featuring its signature "Duality" two-body mechanic. The game launched in
  2024, but the studio wound down and Spectre Divide's online services were shut down in 2025. Mountaintop
  is a consumer game studio, not an API provider, and publishes no developer API, SDKs, or developer
  portal, and its public web and support surfaces are now offline. It remains cataloged in the API
  Evangelist network as an a16z portfolio company with no active API surface.
